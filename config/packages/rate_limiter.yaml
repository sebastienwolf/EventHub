framework:
    rate_limiter:
        # Injected in AuthController as "RateLimiterFactoryInterface $registrationLimiter"
        registration:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

when@test:
    framework:
        rate_limiter:
            registration:
                policy: sliding_window
                limit: 1000
                interval: '1 minute'
