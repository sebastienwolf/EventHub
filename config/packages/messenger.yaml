framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # Consume with: php bin/console messenger:consume async scheduler_reminders -vv
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'

        routing:
            # Laravel "ShouldQueue" equivalent: every message implementing this interface is queued
            App\Message\AsyncMessageInterface: async

when@test:
    framework:
        messenger:
            transports:
                failed: 'in-memory://'
